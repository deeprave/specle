[project]
name = "specle"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["anyio>=4.0"]

[project.scripts]
specle = "specle.main:run"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
