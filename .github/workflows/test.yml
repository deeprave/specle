name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      archive_only: ${{ steps.classify.outputs.archive_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
      - id: classify
        name: Classify pull-request update
        uses: ./.github/actions/pr-validation-lane
        with:
          event-action: ${{ github.event.action }}
          before: ${{ github.event.before }}
          head: ${{ github.event.pull_request.head.sha }}
          base: ${{ github.event.pull_request.base.sha }}
          repository: ${{ github.repository }}
          token: ${{ github.token }}

  lint:
    if: github.event_name == 'push' || needs.classify.outputs.archive_only != 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
      - name: Synchronise dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff check
        run: uv run --frozen ruff check .

  format:
    if: github.event_name == 'push' || needs.classify.outputs.archive_only != 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
      - name: Synchronise dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff format
        run: uv run --frozen ruff format --check .

  type-check:
    if: github.event_name == 'push' || needs.classify.outputs.archive_only != 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
      - name: Synchronise dependencies
        run: uv sync --frozen --all-groups
      - name: Type check
        run: uv run --frozen ty check

  test:
    if: github.event_name == 'push' || needs.classify.outputs.archive_only != 'true'
    needs: classify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Synchronise dependencies
        run: uv sync --frozen --all-groups
      - name: Test
        run: uv run --frozen pytest

  blueprint:
    if: github.event_name == 'push' || needs.classify.outputs.archive_only != 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
      - name: Synchronise dependencies
        run: uv sync --frozen --all-groups
      - name: Validate package blueprints
        run: uv run --frozen specle validate --blueprint --verbose

  archive-validation:
    if: github.event_name == 'pull_request' && needs.classify.outputs.archive_only == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
      - name: Synchronise dependencies
        run: uv sync --frozen --all-groups
      - name: Validate archive-only update
        run: uv run --frozen specle validate .

  verify:
    name: Verify
    if: always()
    needs:
      - classify
      - lint
      - format
      - type-check
      - test
      - blueprint
      - archive-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check applicable quality job outcomes
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ARCHIVE_ONLY: ${{ needs.classify.outputs.archive_only }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPE_CHECK_RESULT: ${{ needs.type-check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BLUEPRINT_RESULT: ${{ needs.blueprint.result }}
          ARCHIVE_RESULT: ${{ needs.archive-validation.result }}
        run: |
          if [[ "$CLASSIFY_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$ARCHIVE_ONLY" == true ]]; then
            [[ "$ARCHIVE_RESULT" == success ]]
          else
            [[ "$LINT_RESULT" == success && "$FORMAT_RESULT" == success && "$TYPE_CHECK_RESULT" == success && "$TEST_RESULT" == success && "$BLUEPRINT_RESULT" == success ]]
          fi
