repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
        exclude: ^main$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix, --line-length=120]

  - repo: https://github.com/deeprave/osvcheck
    rev: v1.6.0
    hooks:
      - id: osvcheck

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2
        files: ^(README\.md|docs/.*\.md|src/specle/blueprints/.*\.md)$

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.1
    hooks:
      - id: cspell
        files: ^(README\.md|docs/.*\.md|src/specle/blueprints/.*\.md)$

  - repo: https://github.com/errata-ai/vale
    rev: v3.28.1
    hooks:
      - id: vale
        args: [--no-exit]
        files: ^(README\.md|docs/.*\.md|src/specle/blueprints/.*\.md)$

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -Walways -Werror
        language: system
        types: [python]
        pass_filenames: false
      - id: ty-check
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: specle-validate
        name: specle validate
        entry: uv run --frozen specle validate . --verbose
        language: system
        pass_filenames: false
        always_run: true
